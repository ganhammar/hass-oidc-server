register_client:
  name: Register OIDC Client
  description: Register a new OIDC client application. The client ID and secret are returned in the response; called without a response variable, they are posted in a notification instead, which every user can read.
  fields:
    client_name:
      name: Client Name
      description: Display name for the client application
      required: true
      example: "Claude Connector"
      selector:
        text:
    redirect_uris:
      name: Redirect URIs
      description: Comma-separated list of allowed redirect URIs
      required: true
      example: "https://app.example.com/callback"
      selector:
        text:
    consent_required:
      name: Require consent
      description: Ask the user to approve each authorization on a consent screen. Off by default for clients you register yourself; dynamically registered clients always ask.
      required: false
      default: false
      selector:
        boolean:

revoke_client:
  name: Revoke OIDC Client
  description: Revoke an OIDC client and end every session it holds. Use "List OIDC Clients" to see all client IDs. For a client that signed in with a metadata document, give its URL client ID to end its sessions.
  fields:
    client_id:
      name: Client ID
      description: The client ID to revoke (copy from "List OIDC Clients" action)
      required: true
      example: "client_abc123xyz"
      selector:
        text:

update_client:
  name: Update OIDC Client
  description: Update redirect URIs and the consent setting for an existing OIDC client. Use "List OIDC Clients" to see all client IDs.
  fields:
    client_id:
      name: Client ID
      description: The client ID to update (copy from "List OIDC Clients" action)
      required: true
      example: "client_abc123xyz"
      selector:
        text:
    redirect_uris:
      name: Redirect URIs
      description: Comma-separated list of allowed redirect URIs
      required: true
      example: "https://app.example.com/callback,http://localhost:3000/auth"
      selector:
        text:
    consent_required:
      name: Require consent
      description: Ask the user to approve each authorization on a consent screen. Leave unset to keep the current setting. Clients registered before 1.6.0 require consent until this is turned off.
      required: false
      selector:
        boolean:

list_clients:
  name: List OIDC Clients
  description: Display all OIDC clients with their IDs, redirect URIs and number of active sessions, including clients signed in through a metadata document (client secrets are hidden). Also returns the list as a response.
  fields: {}

rotate_signing_key:
  name: Rotate Signing Key
  description: Replace the key that signs access and ID tokens with a new one. Only administrators can run this action.
  fields:
    keep_previous_key:
      name: Keep previous key
      description: Keep publishing the old key so tokens it signed stay valid until they expire (at most an hour). Turn this off if the key may have leaked; every outstanding access and ID token then stops working at once.
      required: false
      default: true
      selector:
        boolean:
