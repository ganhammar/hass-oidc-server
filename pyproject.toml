[tool.poetry]
name = "hass-oidc-server"
version = "0.1.0"
description = "OpenID Connect Provider for Home Assistant"
authors = ["ganhammar"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14.2"
PyJWT = "^2.15.1"
cryptography = "^50.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
aiohttp = "^3.14.5"
black = "^26.10.1"
ruff = "^0.17.4"
pre-commit = "^4.7.0"
pytest-aiohttp = "^1.1.1"
requests = "^2.34.2"
pytest-homeassistant-custom-component = "^0.13.375"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []
